<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pasta Nafisa - Financial Dashboard</title>
    <meta name="description" content="Dashboard Keuangan & Pencatatan Transaksi Pasta Nafisa - Gerai Utama Sukapura" />
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-background text-on-surface antialiased selection:bg-primary selection:text-on-primary">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8f9ff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #bb0016; color: white; font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(187, 0, 22, 0.4); margin-bottom: 16px;">
          PN
        </div>
        <div style="width: 24px; height: 24px; border: 2.5px solid #bb0016; border-top-color: transparent; border-radius: 50%; animation: pn-spin 0.8s linear infinite; margin-bottom: 12px;"></div>
        <p style="font-size: 13px; font-weight: 600; color: #151c26; margin: 0;">Memuat Pasta Nafisa...</p>
        <style>
          @keyframes pn-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
